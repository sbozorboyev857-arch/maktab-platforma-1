{% extends "base.html" %}
{% block title %}Kirish - Maktab Platformasi{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-bg-pattern"></div>
    <div class="login-container animate-slide-up">
        <div class="login-logo">
            <div class="logo-icon">🎓</div>
            <h1 class="login-title">Maktab Platformasi</h1>
            <p class="login-subtitle">Zamonaviy ta'lim tizimiga xush kelibsiz</p>
        </div>
        <form action="/login" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">👤 Login</label>
                <input type="text" id="username" name="username" placeholder="Loginingizni kiriting" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">🔒 Parol</label>
                <input type="password" id="password" name="password" placeholder="Parolni kiriting" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">🚀 Kirish</button>
        </form>
        <div class="login-info">
            <p>📌 O'quvchilar faqat o'qituvchi bergan login va parol orqali kirishadi</p>
        </div>
    </div>
</div>
{% endblock %}
